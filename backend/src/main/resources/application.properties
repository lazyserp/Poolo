spring.application.name=poolo

# H2 In-Memory Database (zero-setup local development)
spring.datasource.url=jdbc:h2:mem:poolodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (view tables at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (256-bit secret for HS256)
poolo.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
poolo.jwt.access-token-expiration-minutes=15
poolo.jwt.refresh-token-expiration-days=7
